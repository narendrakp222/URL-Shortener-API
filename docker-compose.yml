version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: url_shortener_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: url_shortener_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortener_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Production URL Shortener API
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/url_shortener_db
      - BASE_URL=http://localhost:8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
